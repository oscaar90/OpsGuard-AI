# PLANTILLA — no contiene secretos reales. NO poner la API key aquí ni commitear
# el Secret real. El Secret de verdad se crea de forma imperativa (fuera de git):
#
#   kubectl -n opsguard create secret generic opsguard-secrets \
#     --from-literal=OPENROUTER_API_KEY='sk-or-...'
#
# La clave vive solo en el Secret; el Deployment la consume por envFrom. Nunca
# aparece en el manifest del Deployment ni en un env plano.
#
# En este lab Gate 1 (detección local de secretos) no necesita API key, así que
# el Secret se creó con un valor dummy solo para demostrar el cableado envFrom.
apiVersion: v1
kind: Secret
metadata:
  name: opsguard-secrets
  namespace: opsguard
type: Opaque
stringData:
  OPENROUTER_API_KEY: "REEMPLAZAR_FUERA_DE_GIT"
